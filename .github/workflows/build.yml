name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '.vscode/**'
      - 'benchmark/**'
      - 'docs/**'
      - 'examples/**'
      - '*.md'

  pull_request:
    branches:
      - master
    paths-ignore:
      - '.vscode/**'
      - 'benchmark/**'
      - 'docs/**'
      - 'examples/**'
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The minimum supported Node version and the current LTS
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Build (CJS + ESM + types)
      run: npm run build

    - name: Smoke test package entry points
      run: |
        node -e "require('@moleculer/mcp-server').McpServerMixin"
        node --input-type=module -e "const m = await import('@moleculer/mcp-server'); m.McpServerMixin"

  # As a project depending on a commit of the repository (`npm install git+https://...#<commit>`):
  # npm installs the devDependencies and builds the package with the `prepare` script
  git-install:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22.x

    # npm clones the repository: the commit must be reachable from a branch (pull requests check out a detached merge commit)
    - name: Branch of the commit
      run: git branch git-install-check

    - name: Install from git into a new project
      working-directory: ${{ runner.temp }}
      run: |
        mkdir consumer && cd consumer
        npm init -y
        npm install moleculer moleculer-web "git+file://$GITHUB_WORKSPACE#$GITHUB_SHA"
        node -e "require('@moleculer/mcp-server').McpServerMixin"
        node --input-type=module -e "const m = await import('@moleculer/mcp-server'); m.McpServerMixin"
